<style>
body{margin:0;background:#000;font-family:Georgia,serif}

/* ===== PANTALLA 1: LATVERIA ===== */
#intro{position:fixed;inset:0;background:#000;overflow:hidden;z-index:1}
.niebla{position:absolute;inset:-50%;
  background:
   radial-gradient(ellipse at 30% 60%,rgba(40,120,60,.25),transparent 50%),
   radial-gradient(ellipse at 70% 40%,rgba(30,90,50,.2),transparent 55%);
  animation:mover 25s linear infinite}
.niebla.b{animation-duration:40s;animation-direction:reverse;opacity:.7}
@keyframes mover{from{transform:translateX(-10%) rotate(0)}to{transform:translateX(10%) rotate(360deg)}}

.rayo{position:absolute;inset:0;background:#3cff7a;opacity:0;animation:rayo 9s infinite}
@keyframes rayo{0%,92%,96%,100%{opacity:0}93%{opacity:.18}94%{opacity:0}95%{opacity:.1}}

.castillo{position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:min(900px,100%);filter:drop-shadow(0 0 25px rgba(60,255,122,.25));
  animation:flota 8s ease-in-out infinite}
@keyframes flota{50%{transform:translateX(-50%) translateY(-6px)}}

.titulo{position:absolute;top:12%;width:100%;text-align:center;color:#7bd68f;
  letter-spacing:.6em;font-size:14px;opacity:.7;text-transform:uppercase}

.entrar{position:absolute;bottom:14px;right:18px;color:#3a5a44;font-size:11px;
  letter-spacing:.3em;text-decoration:none;opacity:.35;transition:.4s}
.entrar:hover{opacity:1;color:#7bd68f}

/* ===== PANTALLA 2: XATSPACE ===== */
#entrar{display:none;position:fixed;inset:0;background:#000;z-index:2;text-align:center}
#entrar:target{display:block}
.frase{position:absolute;top:38%;width:100%;color:#e8e8e8;font-size:22px;
  letter-spacing:.15em;font-style:italic;animation:aparece 3s ease both}
@keyframes aparece{from{opacity:0}to{opacity:1}}
.player{position:absolute;bottom:25px;left:50%;transform:translateX(-50%);
  width:300px;border:1px solid #1e1e1e;border-radius:10px;overflow:hidden;
  box-shadow:0 0 15px rgba(255,255,255,.05)}
.player iframe{display:block;border:0}
</style>

<!-- PANTALLA 1 -->
<div id="intro">
  <div class="niebla"></div>
  <div class="niebla b"></div>
  <div class="rayo"></div>
  <div class="titulo">Latveria</div>

  <svg class="castillo" viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg">
    <g fill="#050805" stroke="#1f4d2e" stroke-width="1.5">
      <polygon points="0,380 0,300 120,240 200,290 300,220 360,250 360,380"/>
      <polygon points="540,380 540,250 600,220 700,280 780,230 900,300 900,380"/>
      <rect x="380" y="150" width="140" height="230"/>
      <polygon points="380,150 450,60 520,150"/>
      <rect x="300" y="200" width="50" height="180"/>
      <polygon points="295,200 325,120 355,200"/>
      <rect x="550" y="190" width="50" height="190"/>
      <polygon points="545,190 575,110 605,190"/>
      <rect x="440" y="10" width="20" height="60"/>
      <polygon points="437,10 450,-25 463,10"/>
    </g>
    <g fill="#7bff9c" opacity=".85">
      <rect x="440" y="200" width="8" height="18"/>
      <rect x="460" y="240" width="8" height="18"/>
      <rect x="320" y="240" width="6" height="14"/>
      <rect x="570" y="230" width="6" height="14"/>
    </g>
  </svg>

  <a class="entrar" href="#entrar">entrar</a>
</div>

<!-- PANTALLA 2 -->
<div id="entrar">
  <div class="frase">Escribe aquí tu frase</div>

  <div class="player">
    <iframe width="300" height="80"
      src="https://www.youtube-nocookie.com/embed/ID_DEL_VIDEO"
      allow="autoplay; encrypted-media"></iframe>
  </div>
</div>
